- name: Khoros Marketing Conversations API
  description: The Spredfast-lineage Khoros Marketing API surface covering Conversations, Publishing,
    Analytics Reporting and Notification. Uses a 3-legged OAuth 2.0 flow (/authorize, /grant, /token)
    and Bearer access tokens that remain valid for two years and persist across password changes.
  humanURL: https://developer.khoros.com/khorosmarketingdevdocs/reference
