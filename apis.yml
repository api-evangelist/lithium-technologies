aid: lithium-technologies
name: Lithium Technologies
description: 'Lithium Technologies is the online-community and social-customer-engagement software company
  founded in 2001 that pioneered brand-hosted community forums, gamification and reputation systems for
  enterprise customer support. Acquired by Vista Equity Partners in 2017 and merged with social-media
  management vendor Spredfast in 2019, the combined business now operates as Khoros. The Khoros platform
  carries the Lithium lineage forward across five developer surfaces: Khoros Communities (Classic REST
  v1/v2 plus the LiQL query language, and the newer Aurora GraphQL API and SDK), Khoros Care (Automation
  Framework events, Author and Conversation, CRM Gateway, Analytics and Brand Messenger messaging SDKs),
  Khoros Marketing (the Spredfast-lineage Conversations, Publishing, Analytics Reporting and Notification
  APIs on api.spredfast.com), and Khoros Flow (Socket, REST and Management APIs for conversational bots).
  Developer documentation is published at developer.khoros.com and the first-party open-source SDKs
  remain under the lithiumtech GitHub organization.'
